services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaewoon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: chaewoon-backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3849:3849"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chaewoon?schema=public
      PORT: "3849"
      CORS_ORIGIN: http://localhost:3847
      JWT_SECRET: ${JWT_SECRET:-chaewoon-docker-jwt-secret}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-chaewoon-docker-setup-key}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: chaewoon-front/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3849
    restart: unless-stopped
    ports:
      - "3847:3847"
    environment:
      INTERNAL_API_URL: http://backend:3849
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
